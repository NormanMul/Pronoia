name: Assessment commands

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed, labeled, unlabeled, reopened]

permissions: {}

jobs:
  command:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'pronoia') &&
      github.event.sender.login != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/')) ||
        (github.event_name == 'issues' &&
          (github.event.action == 'closed' || github.event.action == 'reopened' ||
            startsWith(github.event.label.name, 'status:')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply queued commands
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pronoia -- apply-command
      - name: Guard status and closure
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pronoia -- apply-command
      - name: Record authoritative processing
        run: echo 'Pronoia processed the comment queue or checked the status guard.' >> "$GITHUB_STEP_SUMMARY"
