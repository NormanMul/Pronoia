name: Sync security alerts

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions: {}

env:
  PRONOIA_READ_APP_ID: ${{ vars.PRONOIA_READ_APP_ID || secrets.PRONOIA_READ_APP_ID || vars.PRONOIA_APP_ID || secrets.PRONOIA_APP_ID }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: security-discovery
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
      actions: write # Explicit workflow_dispatch is the GITHUB_TOKEN retrigger exception.
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci -w @pronoia/core -w @pronoia/cli --include-workspace-root
      - run: npm run build -w @pronoia/core && npm run build -w @pronoia/cli
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pronoia-cache
          key: enrichment-${{ github.repository }}-${{ github.run_id }}-discovery
          restore-keys: enrichment-${{ github.repository }}-
      - name: Optional separate scanner READ App
        id: read-app
        if: env.PRONOIA_READ_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.PRONOIA_READ_APP_ID }}
          private-key: ${{ secrets.PRONOIA_READ_APP_PRIVATE_KEY || secrets.PRONOIA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-metadata: read
          permission-security-events: read
          permission-vulnerability-alerts: read
          permission-secret-scanning-alerts: read
      - name: Discover, then dispatch the shared per-issue authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRONOIA_TARGET_TOKEN: ${{ secrets.PRONOIA_TARGET_TOKEN || secrets.PRONOIA_SCAN_TOKEN || steps.read-app.outputs.token }}
          PRONOIA_NVD_ENABLED: ${{ vars.PRONOIA_NVD_ENABLED }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node packages/cli/dist/index.js sync-security --discover --dispatch
